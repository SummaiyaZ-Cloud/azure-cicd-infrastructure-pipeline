name: Deploy Production Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-production:
    name: Validate PROD Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep template
        run: az bicep build --file infra/main.bicep

      - name: Validate production deployment
        run: |
          az deployment group validate \
            --resource-group rg-cicd-prod \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam

      - name: Preview production changes with What-If
        run: |
          az deployment group what-if \
            --resource-group rg-cicd-prod \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam

  deploy-production:
    name: Deploy PROD Infrastructure
    needs: validate-production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy production infrastructure
        run: |
          az deployment group create \
            --name cicd-prod-${{ github.run_number }} \
            --resource-group rg-cicd-prod \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam