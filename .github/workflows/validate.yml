name: Infrastructure Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep template
        run: az bicep build --file infra/main.bicep

      - name: Build DEV parameters
        run: >
          az bicep build-params
          --file infra/parameters/dev.bicepparam
          --outfile /tmp/dev-parameters.json

      - name: Build PROD parameters
        run: >
          az bicep build-params
          --file infra/parameters/prod.bicepparam
          --outfile /tmp/prod-parameters.json

      - name: Validate DEV deployment
        run: |
          az deployment group validate \
            --resource-group rg-cicd-dev \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam

      - name: DEV What-If
        run: |
          az deployment group what-if \
            --resource-group rg-cicd-dev \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam